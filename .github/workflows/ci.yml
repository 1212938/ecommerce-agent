name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch (avoid CUDA wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies (incl. test tools)
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/test_agents.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ecommerce-agent-api .
      - name: Build Streamlit image
        run: docker build -f Dockerfile.streamlit -t ecommerce-agent-streamlit .
